<!-- 
  File: movie.html
  Description: This page displays movie info for a selected movie.
  Info includes the movie title, poster, release date, and description.

  Authors: Kaleb Phillips & Arnulfo Rivera 
  Date: August 7 2024
  Class: UTSA CS-4843-01T Cloud Computing
-->
<!DOCTYPE html>
<html>
<head>
    <title>Movie Description</title>
    <link rel="stylesheet" href="../static/css/main.css">
</head>
<body>
    <h1>{{ title }}</h1>
    <img id="poster">
    <script>
        var img = "{{image}}";
        var source = `https://image.tmdb.org/t/p/w500${img}`;
        document.getElementById("poster").setAttribute("src", source);
    </script> 
    <p>{{ release_date }}</p>
    <h1>Movie Description</h1>
    <p>{{ description }}</p>
    <form action="/" method="get">
        <input type="submit" value="Back to search">
    </form>
</body>
</html>
